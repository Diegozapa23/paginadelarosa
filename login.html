<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Admin</title>
  <link rel="stylesheet" href="uno.css">
</head>
<body>

<section class="section">
  <div class="booking" style="max-width:400px;margin:auto;">
    <div class="title">
      <span>ACCESO ADMIN</span>
      <h2>Ingresar</h2>
    </div>

    <input type="password" id="clave" placeholder="Contraseña admin">
    <br><br>
    <button class="form-btn" onclick="login()">ENTRAR</button>

    <p id="mensajeReserva"></p>
  </div>
</section>

<script>
function login() {
  const clave = document.getElementById("clave").value;

  if (clave === "1234") {
    localStorage.setItem("adminLogueado", "true");
    window.location.href = "admin.html";
  } else {
    document.getElementById("mensajeReserva").textContent = "Contraseña incorrecta";
  }
}
</script>

</body>
</html>

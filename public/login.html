<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador - Beauty Studio De La Rosa</title>
  <link rel="preload" href="fonts/allura-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/cormorant-garamond-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/montserrat-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #fffaf8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px;
      right: -120px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(216,201,192,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(216,201,192,0.13) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-card {
      background: white;
      border-radius: 36px;
      padding: 56px 50px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.08);
      border: 1px solid rgba(216,201,192,0.4);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.7s ease-out forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-icon {
      font-size: 48px;
      color: #d8c9c0;
      margin-bottom: 8px;
      display: block;
      animation: bounce 2.5s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .login-subtitle {
      font-size: 10px;
      letter-spacing: 4px;
      color: #d8c9c0;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    .login-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      color: #7a716d;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .login-firma {
      font-family: 'Allura', cursive;
      font-size: 26px;
      color: #d8c9c0;
      margin-bottom: 20px;
    }

    .login-divider {
      width: 100px;
      height: 1px;
      background: #e6cbc8;
      margin: 0 auto 24px;
      position: relative;
    }

    .login-divider::after {
      content: "♡";
      position: absolute;
      left: 50%;
      top: -11px;
      transform: translateX(-50%);
      background: white;
      padding: 0 10px;
      color: #d8c9c0;
      font-size: 14px;
    }

    .login-text {
      font-size: 14px;
      color: #888;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      color: #7a716d;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 15px 48px 15px 18px;
      border: 1px solid rgba(216,201,192,0.8);
      border-radius: 14px;
      background: #fffaf8;
      color: #4b4b4b;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      outline: none;
      transition: 0.3s ease;
    }

    .input-wrapper input:focus {
      border-color: #c9b5ab;
      background: white;
      box-shadow: 0 0 0 4px rgba(216,201,192,0.2);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #d8c9c0;
      font-size: 18px;
      padding: 4px;
      transition: 0.2s;
    }

    .toggle-pass:hover { color: #7a716d; }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #d8c9c0, #c9b5ab);
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s ease;
      margin-top: 8px;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(216,201,192,0.5);
    }

    .login-btn:active { transform: translateY(0); }

    .login-message {
      margin-top: 18px;
      font-size: 13px;
      min-height: 20px;
      border-radius: 10px;
      padding: 0;
      transition: 0.3s;
    }

    .login-message.error {
      color: #c0392b;
      background: #fadbd8;
      padding: 12px 16px;
      border-left: 3px solid #c0392b;
      text-align: left;
    }

    .login-message.cargando {
      color: #7a716d;
      background: #fffaf8;
      padding: 10px;
    }

    @media (max-width: 480px) {
      .login-card { padding: 40px 28px; border-radius: 28px; }
      .login-title { font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <span class="login-icon">✿</span>
    <span class="login-subtitle">BEAUTY STUDIO DE LA ROSA</span>
    <h1 class="login-title">Panel Admin</h1>
    <div class="login-firma">by Catalina</div>
    <div class="login-divider"></div>
    <p class="login-text">Ingresa tus credenciales para administrar las reservas.</p>

    <div class="input-group">
      <label>Usuario</label>
      <div class="input-wrapper">
        <input type="text" id="usuario" placeholder="Tu usuario" autocomplete="username">
      </div>
    </div>

    <div class="input-group">
      <label>Contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="clave" placeholder="Tu contraseña" autocomplete="current-password">
        <button class="toggle-pass" type="button" onclick="togglePass()" title="Mostrar/ocultar">👁</button>
      </div>
    </div>

    <button class="login-btn" onclick="login()">INGRESAR</button>

    <p id="mensaje" class="login-message"></p>
  </div>

  <script>
    function togglePass() {
      const input = document.getElementById("clave");
      input.type = input.type === "password" ? "text" : "password";
    }

    async function login() {
      const usuario = document.getElementById("usuario").value.trim();
      const clave = document.getElementById("clave").value;
      const mensaje = document.getElementById("mensaje");

      if (!usuario || !clave) {
        mensaje.className = "login-message error";
        mensaje.textContent = "Por favor completa todos los campos.";
        return;
      }

      mensaje.className = "login-message cargando";
      mensaje.textContent = "Verificando...";

      try {
        const res = await fetch("/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, clave })
        });

        if (res.ok) {
          const credenciales = btoa(`${usuario}:${clave}`);
          localStorage.setItem("adminAuth", credenciales);
          window.location.href = "admin.html";
        } else {
          mensaje.className = "login-message error";
          mensaje.textContent = "Usuario o contraseña incorrectos.";
        }
      } catch (e) {
        mensaje.className = "login-message error";
        mensaje.textContent = "Error al conectar con el servidor.";
      }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>

</body>
</html>
